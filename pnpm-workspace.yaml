packages:
  - .
  - dsh-runtime

# Use pnpm's isolated deploy implementation. The legacy implementation prunes
# the workspace root to production dependencies as a side effect.
injectWorkspacePackages: true

# Deliberate supply-chain tradeoff: an official dsh release is a same-day graph
# of roughly 197 scoped packages, so release-day integration exempts the whole
# scope instead of maintaining a generated per-package list. This also means a
# newly published @deepseek-ai package can bypass pnpm's minimum release age.
# Keep runtime direct dependencies exact, use --frozen-lockfile in CI, and
# review every @deepseek-ai lockfile change before upgrading the bundled dsh.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
  # The bundled market is this project's own package, published from a tagged
  # GitHub Actions run with npm provenance; its release-day version is exempted
  # one version at a time, never by wildcard.
  - dsh-desktop-safe-market@0.4.0

# electron-builder 26.15.3 uses ElectronDownloadCacheMode, which was added in
# @electron/get 3.1.0, while its published range still allows incompatible 3.0.0.
overrides:
  "@electron/get": 3.1.0
  # Koffi 3.1.3/3.1.4 Windows prebuilds dynamically link the MSVC runtime,
  # which is absent on a clean Windows installation. 3.1.5+ reverted those
  # builds; pin the whole graph so transitive subprocess/sandbox imports use it.
  koffi: 3.1.6

# pnpm 10+ blocks dependency lifecycle scripts until they are reviewed here.
# The dsh runtime needs node-pty's prebuilt helper permissions and Koffi's
# platform package; the remaining scripts are optional/no-op for this app.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: false

# Electron's embedded Node aborts when the pinned picker wraps its COM-owned
# path through koffi.view(). Keep this exact-version patch aligned with
# `pnpm run check:picker` and reconcile or remove it whenever dsh is upgraded.
patchedDependencies:
  '@deepseek-ai/dsh-host-directory-picker-native@0.1.2-rc.1': patches/@deepseek-ai__dsh-host-directory-picker-native@0.1.2-rc.1.patch
  # Issue #16: hidden runner console and background spawns. Reconcile these
  # exact-version patches with check:win32-console on every runtime upgrade.
  '@deepseek-ai/dsh-sandbox-windows-acl@0.1.2-rc.1': patches/@deepseek-ai__dsh-sandbox-windows-acl@0.1.2-rc.1.patch
  '@deepseek-ai/dsh-subprocess-local@0.1.2-rc.1': patches/@deepseek-ai__dsh-subprocess-local@0.1.2-rc.1.patch
