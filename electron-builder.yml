appId: io.github.bruc3van.dsh-desktop
productName: DSH Desktop
copyright: Copyright © 2026 bruc3van

directories:
  output: release

files:
  - .build/**/*
  # beforePack records the installer's MAX_PATH budget here for
  # scripts/smoke-package.mjs to re-check; it is build metadata, not app code.
  - "!.build/nsis-path-budget.json"
  - resources/**/*
  # Build-time source for the .icns only; nothing reads it at runtime.
  - "!resources/icon-mac.png"
  - package.json
  - LICENSE
  - "!node_modules/**/*"

extraResources:
  - from: .runtime/node_modules
    to: dsh-runtime/node_modules
  # The runtime child reads this as an ordinary file, outside app.asar, the
  # same way it reads the bundled CLI entry beside it.
  - from: .build/runtime-launcher.mjs
    to: runtime-launcher.mjs
  - from: .build/dsh-cli.mjs
    to: dsh-cli.mjs

asar: true
npmRebuild: false
# The bundled runtime contains tens of thousands of files. Normal compression
# keeps release time bounded; maximum compression made Windows packaging spend
# long periods without progress output for a modest download-size saving.
compression: normal
artifactName: dsh-desktop-${version}-${os}-${arch}.${ext}

# Chromium ships 55 locale packs (44 MB on Windows / 45 MB on macOS) but the
# client only needs zh and en. Both spellings are required: the platforms name
# them differently (zh-CN.pak on Windows, zh_CN.lproj on macOS) and
# electron-builder matches with a reverse-prefix check (the wanted name must
# start with the file's language), so listing "zh-CN" alone would silently
# delete the macOS Chinese pack. scripts/smoke-package.mjs asserts the result
# per platform, turning any future silent deletion into a red build.
electronLanguages:
  - zh-CN
  - zh_CN
  - en-US
  - en

mac:
  # Apple's app-icon grid: an 824x824 squircle body centred in a 1024 canvas,
  # transparent elsewhere. Matching the system's own proportions keeps the dock
  # tile the same size as every other app, and keeps macOS 26's enclosure clear
  # of the artwork instead of drawing a second border around it.
  icon: resources/icon-mac.png
  category: public.app-category.developer-tools
  target:
    - dmg
  # No Apple Developer ID yet, so we self-sign ad-hoc instead of shipping
  # unsigned. This lets Gatekeeper show its normal "unidentified developer"
  # prompt (with an Open Anyway button) instead of "app is damaged", which is
  # what unsigned arm64 builds get. Not a substitute for real notarization.
  identity: "-"
  hardenedRuntime: false
  # The Agent reads and writes the user's own files, so macOS asks before the
  # first access to a protected folder. Without these strings the prompt states
  # no reason at all; with them it says who is asking and why, which is the
  # difference between an informed grant and a reflexive denial.
  extendInfo:
    NSDesktopFolderUsageDescription: >-
      Harness Agent 需要访问桌面上的文件来完成你交给它的任务。/
      The Harness Agent needs Desktop files to carry out the tasks you give it.
    NSDocumentsFolderUsageDescription: >-
      Harness Agent 需要访问「文稿」中的文件来完成你交给它的任务。/
      The Harness Agent needs Documents files to carry out the tasks you give it.
    NSDownloadsFolderUsageDescription: >-
      Harness Agent 需要访问「下载」中的文件来完成你交给它的任务。/
      The Harness Agent needs Downloads files to carry out the tasks you give it.
    NSRemovableVolumesUsageDescription: >-
      Harness Agent 需要访问可移动磁盘上的项目文件。/
      The Harness Agent needs project files stored on removable volumes.
    NSNetworkVolumesUsageDescription: >-
      Harness Agent 需要访问网络位置上的项目文件。/
      The Harness Agent needs project files stored on network volumes.

dmg:
  title: DSH Desktop ${version}
  writeUpdateInfo: false

win:
  # The taskbar renders app icons very small; this variant preserves the same
  # dark tile while giving the white glyph enough visual weight beside native
  # Windows apps. macOS and in-app branding continue to use their own assets.
  icon: resources/icon-win.png
  target:
    - nsis

# The assisted wizard already draws an InstFiles list under the progress bar;
# electron-builder then silences it (`SetDetailsPrint none`) and extracts the
# app 7z without a percent string. The include keeps that list open; beforePack
# edits the templates so the list shows stage lines and 7-Zip's `N% (a / b MB)`.
#
# The same hook also splices a direct-extract fast path in front of that
# template's staging copy. Upstream extracts into $PLUGINSDIR\7z-out and then
# CopyFiles the tree into $INSTDIR, writing all ~11500 packaged files a second
# time, and the installer pays per file, not per byte: locally, 283 MB in 20
# files copies in 0.3 s while 124 MB in 12508 files takes 11.6 s. Measured A/B
# on one machine: 105.7 s and 498.8 MB of peak TEMP before, 36.7 s and 94.5 MB
# after.
#
# The fast path is guarded, not unconditional. The staging copy exists so a
# locked target file can be retried, and customRemoveFiles in
# resources/installer.nsh does not promise an empty $INSTDIR — RMDir /r skips
# whatever is locked and says nothing. So the direct extract runs only when
# $INSTDIR is genuinely empty; a leftover file, or an error partway through,
# falls through to electron-builder's own body with its retries intact. That
# body is left byte for byte as upstream wrote it and pinned by hash, so a
# future electron-builder cannot quietly add a step the fast path would skip.
#
# Silent `/S` installs are unchanged. Re-check with `pnpm run check:nsis-details`
# after bumping electron-builder — the templates are not a public API.
beforePack: scripts/patch-nsis-install-details.mjs

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false
  include: resources/installer.nsh

# Releases are assembled explicitly by GitHub Actions. The in-app updater
# reads latest.json from the GitHub Release (see scripts/write-update-feed.mjs);
# electron-builder must not infer its own publish provider or latest.yml.
publish: null
