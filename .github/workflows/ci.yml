# 每次推送与 PR 都跑一遍契约检查。
#
# 在此之前，仓库只有「打 tag 才触发」的发布流水线，于是 typecheck、lint 和全部
# 契约检查第一次运行的时机就是发布本身。0.2.3 连续两次栽在这上面：一次是
# check:pnpm-runtime 在 GitHub Windows runner 的 8.3 短路径上失败，一次是
# check:updater 泄漏监听句柄、进程跑完断言后不退出，把发布任务挂到 45 分钟超时。
# 两个 bug 都只可能由「真发一次版」发现——这个工作流就是来消除那种发现方式的。
#
# 因此 app 作业刻意与发布的构建作业保持同构（同样 prepare:runtime、同样在
# windows-latest 上跑 Electron 检查），只是不打包；package 作业则真打一次 macOS
# DMG，因为「装出来的应用能不能起来」只有打包之后才回答得了。CI 绿而发布红的
# 检查没有价值。
name: 持续集成 / CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取代旧的：这里的反馈越快越好，与发布任务相反。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: 契约检查 ${{ matrix.os }} / Contracts ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows 不是冗余：今天那个短路径 bug 只在 Windows 上成立，而它所在的
        # 脚本在 Linux 上跑一万次也是绿的。
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: 检出 / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 pnpm / Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 安装 Node.js / Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 校验客户端身份指纹 / Verify client identity fingerprint
        run: pnpm run check:identity

      - name: 校验发布产物命名约定 / Verify release artifact naming
        run: pnpm run check:release-artifacts

      - name: 类型检查 / Typecheck
        run: pnpm run typecheck

      - name: 代码检查 / Lint
        run: pnpm run lint

      - name: 构建主进程 / Build shell
        run: pnpm run build

      - name: 验证运行时环境隔离 / Verify runtime environment isolation
        run: pnpm run check:runtime-env

      - name: 验证 dsh 网关分类 / Verify dsh CLI gateway policy
        run: pnpm run check:dsh-cli

      - name: 验证智能连接来源契约 / Verify Smart-mode source preference
        run: pnpm run check:smart-runtimes

      - name: 验证内置插件接入 / Verify bundled plugin seat
        run: pnpm run check:bundled-plugin

      - name: 验证运行时锁契约 / Verify runtime lock contract
        run: pnpm run check:runtime-lock

      - name: 验证托盘重启杀进程表 / Verify tray-restart stop table
        run: pnpm run check:restart

      - name: 验证运行时解析契约 / Verify runtime resolution contract
        run: pnpm run check:runtime-resolution

  app:
    name: 应用契约检查 ${{ matrix.os }} / Application contracts ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 两个平台都要：check:auto-fallback 里一处取样竞态在 Windows 上稳定通过、
        # 在两台 macOS runner 上确定性失败，把 0.2.3 的发布拦了一次。只跑一个
        # 平台的应用契约检查，等于把这类差异留给发布去发现。
        include:
          - os: windows-latest
            runtime_target: win32-x64
          - os: macos-15
            runtime_target: darwin-arm64

    steps:
      - name: 检出 / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 pnpm / Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 安装 Node.js / Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 构建应用 / Build application
        run: pnpm run build

      - name: 准备内置 dsh 运行时 / Prepare bundled dsh runtime
        run: pnpm run prepare:runtime
        env:
          DSH_RUNTIME_TARGET: ${{ matrix.runtime_target }}

      - name: 验证 pnpm 与 Electron Node 耦合 / Verify pnpm engine against Electron Node
        run: pnpm run check:pnpm-engine

      # 以下五项此前只在发布时才跑，check:connection 与 check:installed-runtime
      # 则从不在任何工作流里运行——733 行契约断言（含第三方跳转围堵）只靠人手动跑。
      #
      # 每一项都带 !cancelled()：一套契约检查里，第一个失败之后把其余全部跳过
      # 会把一次运行能给出的信息砍掉大半。作业照样是红的，但你能一次看全。
      - name: 验证连接切换与跳转围堵 / Verify connection switching and redirect containment
        if: ${{ !cancelled() }}
        run: pnpm run check:connection

      - name: 验证已安装运行时解析 / Verify installed-runtime resolution
        if: ${{ !cancelled() }}
        run: pnpm run check:installed-runtime

      - name: 验证更新器契约 / Verify updater contract
        if: ${{ !cancelled() }}
        run: pnpm run check:updater

      - name: 验证智能模式回落恢复 / Verify smart-mode fallback recovery
        if: ${{ !cancelled() }}
        run: pnpm run check:auto-fallback

      - name: 验证连接失败界面 / Verify connection failure surface
        if: ${{ !cancelled() }}
        run: pnpm run check:error-surface

  # 唯一一个真正打包的作业。Windows 侧早有等价门禁——release.yml 会静默装一遍
  # NSIS 包、再对装出来的 exe 跑冒烟；macOS 侧此前什么都没有：smoke:package 跑的
  # 是 electron-builder 留下的未打包 .app 目录，DMG 本身从没被挂载、拷出、启动过，
  # 一个坏掉的 DMG 会照常发布。放在这里而不是直接进 release.yml：发布流水线只由
  # tag 触发，没在 CI 跑过的门禁步骤等于拿发布当测试环境（0.2.3 已经这样烧掉三轮）。
  #
  # PR 上不跑：它要真打一次包，与 app 作业抢同一批 macOS runner——有一轮把 app
  # 作业压到排队 20 多分钟。PR 想要的是快反馈，而「装出来的应用能不能起来」在
  # 合进 main 时拦住就够了，那仍然远早于打 tag 发布。
  package-macos:
    name: macOS 安装包冒烟 / macOS package smoke
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: 检出 / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 pnpm / Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 安装 Node.js / Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 构建应用 / Build application
        run: pnpm run build

      - name: 准备内置 dsh 运行时 / Prepare bundled dsh runtime
        run: pnpm run prepare:runtime
        env:
          DSH_RUNTIME_TARGET: darwin-arm64

      # 与发布同样的打包命令与签名设置，否则这里绿了也说明不了发布会绿。
      - name: 生成 DMG / Package DMG
        id: package
        run: pnpm exec electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # 打包成功才验证——打包本身failed时后面全是「找不到产物」的噪声；打包成功
      # 之后则彼此不遮蔽，一次运行看全。
      - name: 验证安装包内置运行时 / Smoke packaged runtime
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: pnpm run smoke:package

      - name: 验证 DMG 装出来的应用 / Smoke the app installed from the DMG
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: pnpm run smoke:dmg

  # Windows 侧的同一件事。check:picker、check:pnpm-runtime 和「静默安装 NSIS 再
  # 冒烟」此前只在 release.yml 里跑——Windows 的打包与安装路径至今只在真发版时
  # 验证一次。check:pnpm-runtime 尤其要在 runner 上跑：它栽过的那次是 GitHub
  # Windows runner 的 8.3 短路径 C:\Users\RUNNER~1\...，开发机上的正常路径
  # 跑一万次都是绿的。
  package-windows:
    name: Windows 安装包冒烟 / Windows package smoke
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出 / Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 安装 pnpm / Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: 安装 Node.js / Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      # 内置运行时是几万个小文件，打包写一遍、安装冒烟再写一遍。实时扫描这些文件
      # 会占掉这个作业的大部分时间；排除两个由构建自己拥有的目录只影响 runner
      # 本地，不会进入任何产物。与 release.yml 的同名步骤保持一致。
      - name: 排除 Defender 实时扫描 / Exclude build paths from Defender
        shell: pwsh
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP)) {
            try {
              Add-MpPreference -ExclusionPath $path -ErrorAction Stop
              Write-Host "excluded $path"
            } catch {
              Write-Host "could not exclude ${path}: $($_.Exception.Message)"
            }
          }

      - name: 安装依赖 / Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 构建应用 / Build application
        run: pnpm run build

      - name: 准备内置 dsh 运行时 / Prepare bundled dsh runtime
        run: pnpm run prepare:runtime
        env:
          DSH_RUNTIME_TARGET: win32-x64

      - name: 验证 Windows 目录选择器兼容补丁 / Verify Win32 picker compatibility patch
        run: pnpm run check:picker

      - name: 生成 NSIS 安装包 / Package NSIS installer
        id: package
        run: pnpm exec electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: 验证打包产物中的 pnpm / Verify packaged pnpm
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: pnpm run check:pnpm-runtime

      - name: 验证安装包内置运行时 / Smoke packaged runtime
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: pnpm run smoke:package

      # 与 release.yml 的同名步骤逐字一致：装出来的应用能不能起来，是这里唯一
      # 回答得了、而未打包目录回答不了的问题。
      - name: 验证 NSIS 实际安装结果 / Smoke installed Windows runtime
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -File -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'NSIS installer not found under release/'
          }

          $installDir = Join-Path $env:RUNNER_TEMP ('dsh-desktop-nsis-' + [guid]::NewGuid().ToString('N'))
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "NSIS installer exited with code $($install.ExitCode)"
          }

          $executable = Join-Path $installDir 'DeepSeek Harness Desktop.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Installed executable not found: $executable"
          }
          # Not `pnpm run smoke:package -- ...`: pnpm forwards the separator
          # itself, so the script would receive a literal `--` as its target.
          node scripts/smoke-package.mjs "$executable"
          if ($LASTEXITCODE -ne 0) {
            throw "Installed NSIS runtime smoke failed with code $LASTEXITCODE"
          }
